<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180" role="img" aria-labelledby="title description">
  <title id="title">Taskbar Widgets thumbnail template</title>
  <desc id="description">A neutral Windows taskbar widget placeholder.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f4661"/>
      <stop offset="0.56" stop-color="#306985"/>
      <stop offset="1" stop-color="#183344"/>
    </linearGradient>
    <linearGradient id="widget" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60cdff"/>
      <stop offset="1" stop-color="#4f8cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="320" height="180" rx="14" fill="url(#background)"/>
  <circle cx="253" cy="42" r="58" fill="#fff" opacity=".08"/>
  <rect x="12" y="125" width="296" height="43" rx="9" fill="#171a20" fill-opacity=".88" stroke="#fff" stroke-opacity=".18" filter="url(#shadow)"/>
  <g fill="#fff" fill-opacity=".82">
    <rect x="27" y="138" width="16" height="16" rx="3"/>
    <rect x="51" y="138" width="16" height="16" rx="3"/>
    <rect x="75" y="138" width="16" height="16" rx="3"/>
  </g>
  <rect x="112" y="134" width="104" height="25" rx="7" fill="#0f1217" stroke="#fff" stroke-opacity=".14"/>
  <rect x="121" y="141" width="7" height="11" rx="2" fill="url(#widget)"/>
  <rect x="133" y="141" width="48" height="4" rx="2" fill="#fff" fill-opacity=".88"/>
  <rect x="133" y="149" width="68" height="3" rx="1.5" fill="#fff" fill-opacity=".42"/>
  <circle cx="274" cy="146" r="3" fill="#fff" fill-opacity=".76"/>
  <rect x="282" y="142" width="12" height="8" rx="2" fill="#fff" fill-opacity=".58"/>
  <g transform="translate(26 25)">
    <rect width="52" height="52" rx="12" fill="#111820" fill-opacity=".62" stroke="#fff" stroke-opacity=".14"/>
    <path d="M14 15h10v10H14zm14 0h10v10H28zM14 29h10v10H14zm14 0h10v10H28z" fill="url(#widget)"/>
  </g>
  <text x="92" y="47" fill="#fff" font-family="Segoe UI, sans-serif" font-size="18" font-weight="600">Widget thumbnail</text>
  <text x="92" y="68" fill="#fff" fill-opacity=".68" font-family="Segoe UI, sans-serif" font-size="11">Replace this template with widget artwork</text>
</svg>
