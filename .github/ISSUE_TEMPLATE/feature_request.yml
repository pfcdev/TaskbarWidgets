name: Feature request
description: Suggest an improvement or a new capability
title: "[Feature]: "
labels:
  - feature
  - "status: needs triage"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Taskbar Widgets. Please focus on the problem and expected outcome before implementation details.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what makes it difficult today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like to see.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Product area
      options:
        - Runtime and taskbar integration
        - Built-in widgets
        - Settings app
        - Community SDK
        - Installer and updates
        - Developer tooling
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or alternative designs you considered.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, examples, and links are welcome.

  - type: dropdown
    id: contribution
    attributes:
      label: Would you like to work on this?
      options:
        - "Yes"
        - "Maybe, with guidance"
        - "No"
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched for an existing request that covers this idea.
          required: true
